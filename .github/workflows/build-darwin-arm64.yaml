# Builds the Logix Engine macOS (Apple Silicon) package: a .tgz with the
# logix-engine binary. Called by build-pre-release.yaml, which passes
# BUILD-INFO.json as the 'build-info' artifact.

name: build-darwin-arm64

on:
  workflow_call:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Check required platform
        uses: openlogix/.github/actions/check-platform@main
        with:
          os: darwin
          arch: arm64

      - name: Read the build info
        uses: openlogix/.github/actions/read-build-info@main
        with:
          platform: darwin-arm64

      # Into a subdirectory, not to step on BUILD-INFO.json.
      - name: Checkout the commit to build
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REPO }}
          ref: ${{ env.REPO_COMMIT }}
          path: _repo

      # Installs the Rust version pinned in rust-toolchain.toml.
      - name: Set up Rust
        working-directory: _repo
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # The build tests download the toolchain package (about 526 MB). Cached
      # until the package manifest changes.
      - name: Cache the test toolchain
        uses: actions/cache@v6
        with:
          path: _repo/target/tmp/test-engine/packages
          key: test-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('_repo/src/packages/manifest.json') }}

      # Don't publish a build that fails its own checks.
      - name: Run checks and tests
        working-directory: _repo
        run: scripts/test.sh

      # Cargo needs a semver version: the release date without leading zeros
      # (2026-05-07 is 2026.5.7), never shown (the Open Logix versioning rule).
      - name: Write the semver version
        working-directory: _repo
        run: |
          IFS=- read -r y m d <<< "$RELEASE_TAG"
          semver="$((10#$y)).$((10#$m)).$((10#$d))"
          export SEMVER="$semver"
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{SEMVER}"/m' Cargo.toml
          perl -0pi -e 's/(name = "logix-engine"\nversion = )"[^"]*"/$1"$ENV{SEMVER}"/' Cargo.lock
          grep -q "^version = \"$semver\"" Cargo.toml
          grep -A1 '^name = "logix-engine"$' Cargo.lock | grep -q "^version = \"$semver\""

      # The engine version is the release tag's date, shown as yyyy.mm.dd.
      - name: Build the engine
        working-directory: _repo
        env:
          LOGIX_ENGINE_BUILD_VERSION: ${{ env.RELEASE_TAG }}
        run: scripts/build.sh

      # The package has one top-level folder, logix-engine/, with the
      # binary and the licenses.
      - name: Make the package
        run: |
          mkdir -p _pkg/logix-engine
          cp _repo/target/release/logix-engine _pkg/logix-engine/
          cp _repo/LICENSE-MIT _repo/LICENSE-APACHE _pkg/logix-engine/
          tar -czf "logix-engine-darwin-arm64-${PACKAGE_TAG}.tgz" -C _pkg logix-engine
          tar -tzvf "logix-engine-darwin-arm64-${PACKAGE_TAG}.tgz"

      # Checks what users get: the binary from the package runs, reports the
      # release date as its version (yyyy.mm.dd), and has a valid (ad-hoc) signature
      # (Apple Silicon doesn't run unsigned binaries).
      - name: Verify the package
        run: |
          mkdir _check
          tar -xzf "logix-engine-darwin-arm64-${PACKAGE_TAG}.tgz" -C _check
          bin=_check/logix-engine/logix-engine
          test -f _check/logix-engine/LICENSE-MIT
          test -f _check/logix-engine/LICENSE-APACHE
          version="$("$bin" --version)"
          echo "$version"
          expected="logix-engine ${RELEASE_TAG//-/.}"
          if [[ "$version" != "$expected" ]]; then
            echo "Error: expected $expected, got: $version"
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$bin"
          codesign --display --verbose=2 "$bin" 2>&1 | tee codesign.txt
          grep -q "Signature=adhoc" codesign.txt

      - name: Export the package as an artifact
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: logix-engine-darwin-arm64
          path: logix-engine-darwin-arm64-${{ env.PACKAGE_TAG }}.tgz
